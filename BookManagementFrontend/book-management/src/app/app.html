<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard" aria-label="Book Management dashboard">
      <span class="brand-mark" aria-hidden="true">▣</span>
      <span>Book Management</span>
    </a>

    <nav class="main-nav" aria-label="Main menu">
      <p class="nav-label">Main menu</p>
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V10Z"/></svg></span>
        <span>Dashboard</span>
        <span class="active-dot" aria-hidden="true"></span>
      </a>
      <a routerLink="/books" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4v14a4 4 0 0 0-4-4H3Z"/><path d="M21 18a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-5a4 4 0 0 0-4 4v14a4 4 0 0 1 4-4h5Z"/></svg></span>
        <span>Books</span>
      </a>
      <a routerLink="/categories" routerLinkActive="active">
        <span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M20.59 13.41 13.41 20.59a2 2 0 0 1-2.82 0L3.41 13.41A2 2 0 0 1 2.83 12V5a2 2 0 0 1 2-2h7a2 2 0 0 1 1.41.59l7.35 7.35a2 2 0 0 1 0 2.47Z"/><circle cx="7.5" cy="7.5" r="1.25"/></svg></span>
        <span>Categories</span>
      </a>
    </nav>
  </aside>

  <div class="page-shell">
    <header class="topbar">
      <h1>{{ pageTitle() }}</h1>
    </header>
    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
